<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Manideep Pasupula</title>
  <style>
    :root { --bg: #ffffff; --text: #1f2328; --muted: #6c757d; --accent: #0f6e78; --on-accent: #fff; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1d; --text: #e8e8e8; --muted: #a5a8ab; --accent: #5cc2cc; --on-accent: #0b1a1c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--bg); color: var(--text); font: 17px/1.6 Roboto, system-ui, sans-serif; text-align: center; }
    h1 { font-weight: 300; font-size: 2.4rem; margin: 0 0 .4em; }
    p { color: var(--muted); }
    a { display: inline-block; margin-top: 12px; padding: 11px 20px; border-radius: 999px; background: var(--accent);
      color: var(--on-accent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a id="home" href="/">Back to the homepage</a>
  </main>
  <script>
    // If the site is served as a project page (e.g. /mywebsite/), link back to that folder.
    const project = location.pathname.match(/^\/mywebsite\//);
    if (project) document.getElementById('home').href = project[0];
  </script>
</body>
</html>
